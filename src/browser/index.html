    <!-- <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" /> -->

    <noscript>
      <style>
        .noscript-error {
          margin: 0;
          padding: 0;
          background-color: #d2d5da;
          text-align: center;
          height: 100vh;
        }

        .noscript-message {
          margin: 300px auto;
          border: 1px solid #e6e9ee;
          padding: 30px;
          display: inline-block;
          background-color: white;
        }

        #map {
  position: relative;
  top: 0;
  bottom: 0;
  width: 100%;
  height: 90%;
}

.ol-popup {
 position: absolute;
 background-color: white;
 -webkit-filter: drop-shadow(0 1px 4px rgba(0,0,0,0.2));
 filter: drop-shadow(0 1px 4px rgba(0,0,0,0.2));
 padding: 15px;
 border-radius: 10px;
 border: 1px solid #cccccc;
 bottom: 12px;
 left: -50px;
 min-width: 480px;
}
.ol-popup:after, .ol-popup:before {
 top: 100%;
 border: solid transparent;
 content: " ";
 height: 0;
 width: 0;
 position: absolute;
 pointer-events: none;
}
.ol-popup:after {
 border-top-color: white;
 border-width: 10px;
 left: 48px;
 margin-left: -10px;
}
.ol-popup:before {
 border-top-color: #cccccc;
 border-width: 11px;
 left: 48px;
 margin-left: -11px;
}
.ol-popup-closer {
 text-decoration: none;
 position: absolute;
 top: 2px;
 right: 8px;
}
.ol-popup-closer:after {
 content: "✖";
}
.fileTable {
  width : 100%;
  margin-top: 10px;
  margin-bottom: 5px;
}

table, th, td {
  border: 1px solid black;
  border-collapse: collapse;
}
      </style>
      <div class="noscript-error">
        <div class="noscript-message">
          Neo4j Browser <strong>requires</strong> JavaScript to work properly.
          Please enable it and reload.
        </div>
      </div>
    </noscript>
  </head>

  <body>
    <div id="mount"></div>
  </body>
</html>
